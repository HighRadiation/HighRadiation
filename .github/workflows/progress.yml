name: Update progress chart

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-progress.mjs
      - .github/workflows/progress.yml

permissions:
  contents: write

concurrency:
  group: progress-chart
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate charts
        run: node scripts/generate-progress.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: add a PROGRESS_TOKEN secret (personal access token) to also count private commits.
          GH_TOKEN: ${{ secrets.PROGRESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/progress-light.svg assets/progress-dark.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update progress chart"
            git push
          fi
